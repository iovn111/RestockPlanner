[project]
name = "restock-planner"
version = "0.1.0"
description = "Планирование закупок у поставщика для селлеров Wildberries с восстановлением спроса при дефиците и прогнозом новинок"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "statsforecast>=2.0",
    "scikit-learn>=1.5",
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "keyring>=25.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.scripts]
restock-sync = "restock.sync.__main__:main"

[project.gui-scripts]
restock-planner = "restock.gui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
